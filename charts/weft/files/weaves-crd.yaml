  names:
    kind: Weave
    listKind: WeaveList
    plural: weaves
    shortNames:
    - wv
    singular: weave
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
