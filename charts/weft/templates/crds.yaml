{{- if .Values.crds.install }}
{{- /*
The CRDs are the generated ones, copied verbatim into files/crds/ by "make
generate", so the chart cannot drift from the Go types. Each is parsed here only
to attach the chart's labels and, when asked, the annotation that keeps it
through an uninstall.

weft.run is the group Weft was first deployed under, and is installed only
while legacyAPI.enabled says it is still served.
*/}}
{{- $root := . }}
{{- range $path, $_ := .Files.Glob "files/crds/*.yaml" }}
{{- if or $root.Values.legacyAPI.enabled (not (hasSuffix "weft.run_weaves.yaml" $path)) }}
{{- $crd := $root.Files.Get $path | fromYaml }}
{{- $meta := $crd.metadata }}
{{- $_ := set $meta "labels" (merge (default (dict) $meta.labels) (include "weft.labels" $root | fromYaml)) }}
{{- if $root.Values.crds.keep }}
{{- /*
Deleting a Weave CRD deletes every Weave of that group in the cluster, and each
of those takes the resources it owns with it. Uninstalling a controller must not
be able to destroy infrastructure.
*/}}
{{- $_ := set $meta "annotations" (merge (default (dict) $meta.annotations) (dict "helm.sh/resource-policy" "keep")) }}
{{- end }}
{{- $_ := set $crd "metadata" $meta }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
{{- end }}
