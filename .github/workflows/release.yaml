name: release

# Tags only. A workflow_dispatch run would set GITHUB_REF_NAME to a branch
# rather than a tag, and every version derived from it would be wrong.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}
          provenance: true
          sbom: true

      # Keyless, so there is no signing key to protect or rotate: the signature
      # is bound to this workflow's OIDC identity and recorded in the public
      # transparency log. Worth the two lines for an image that, once running,
      # holds the right to impersonate ServiceAccounts.
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Verify the signature
        run: |
          cosign verify "${IMAGE}@${DIGEST}"             --certificate-identity-regexp "^https://github.com/${{ github.repository }}/"             --certificate-oidc-issuer https://token.actions.githubusercontent.com             >/dev/null
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.push.outputs.digest }}

  chart:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The chart is pinned to the digest that was just published, so an
      # installed release cannot drift under a moved tag.
      - name: Pin the chart to this release
        run: |
          set -euo pipefail
          v='${{ steps.version.outputs.version }}'
          sed -i "s|^version: .*|version: ${v}|" charts/weft/Chart.yaml
          sed -i "s|^appVersion: .*|appVersion: \"${v}\"|" charts/weft/Chart.yaml
          sed -i "s|^  digest: .*|  digest: \"${{ needs.image.outputs.digest }}\"|" charts/weft/values.yaml
          helm lint charts/weft

      - name: Package and push
        run: |
          set -euo pipefail
          helm package charts/weft --destination dist
          echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io \
            --username '${{ github.actor }}' --password-stdin
          helm push dist/weft-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: dist/*.tgz

  github-release:
    runs-on: ubuntu-latest
    needs: [image, chart]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: chart
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            helm install weft oci://ghcr.io/${{ github.repository_owner }}/charts/weft \
              --version ${{ github.ref_name }} \
              --namespace weft-system --create-namespace
            ```

            Image: `${{ env.IMAGE }}@${{ needs.image.outputs.digest }}`

            Both the image and the chart are signed with cosign, keyless:

            ```bash
            cosign verify ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}               --certificate-identity-regexp "^https://github.com/${{ github.repository }}/"               --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```

            Before uninstalling, release any finalizers Weft has placed on
            objects it does not own:

            ```bash
            kubectl -n weft-system exec deploy/weft -- /weft reap
            ```
