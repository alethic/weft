# Merges four of the originals: sqladmin-identity, sqlserver,
# sqladmin-serviceaccount, and sqlcmd.
#
# sqlcmd is the interesting one. It was a CronJob that generated a CronJob - a
# second-order reconciler that existed purely because there was no way to say
# "run when the identity changes", so the inner job re-ran every five minutes
# forever and re-applied the same grants. With a real watch it collapses into a
# single Job keyed off the identity's generation: it runs when the identity
# actually changes, and not otherwise.
apiVersion: weft.run/v1alpha1
kind: Weave
metadata:
  name: sql
  namespace: sweep-labs
spec:
  serviceAccountName: sweep-env-compose

  variables:
    - values:
        prefix: sweep-env
        resourceName: sweep-env
        location: eastus
        resourceGroupName: sweep-env
        providerConfigRef:
          name: azure-default
        sqlcmdImage: mcr.microsoft.com/mssql-tools18:latest
        # The app identity that needs a database user. Ranged over at build time in
        # the original chart; here it is a list the program loops over.
        databaseUsers:
        - name: app
          identity: sweep-env-app


  program: |
    def compose(variable):
        resourceGroup = read("azure.m.upbound.io/v1beta1", "ResourceGroup", "sweep-env")
        appIdentity = read("managedidentity.azure.m.upbound.io/v1beta1", "UserAssignedIdentity", "sweep-env-app")

        rg_id = require(resourceGroup, "status.atProvider.id")
        admin_name = variable.resourceName + "-sqladmin"

        # The identity the SQL server runs its AAD admin as. Nothing before it.
        sqladmin_identity = resource({
            "apiVersion": "managedidentity.azure.m.upbound.io/v1beta1",
            "kind": "UserAssignedIdentity",
            "metadata": {
                "name": variable.prefix + "-sqladmin",
                "annotations": {
                    "crossplane.io/external-name":
                        rg_id + "/providers/Microsoft.ManagedIdentity/userAssignedIdentities/" + admin_name,
                },
            },
            "spec": {
                "providerConfigRef": variable.providerConfigRef,
                "forProvider": {
                    "name": admin_name,
                    "location": variable.location,
                    "resourceGroupName": variable.resourceGroupName,
                },
            },
        })

        admin_client_id = get(sqladmin_identity.observed, "status.atProvider.clientId")
        admin_principal = get(sqladmin_identity.observed, "status.atProvider.principalId")
        if not admin_client_id or not admin_principal:
            pending("clientId and principalId on the SQL admin identity")
            return

        # The workload-identity ServiceAccount, and the server itself. Both
        # need the identity and neither needs the other, so they go together.
        resource({
            "apiVersion": "v1",
            "kind": "ServiceAccount",
            "metadata": {
                "name": variable.prefix + "-sqladmin",
                "annotations": {
                    "azure.workload.identity/client-id": admin_client_id,
                },
            },
        })

        sqlserver = resource({
            "apiVersion": "sql.azure.m.upbound.io/v1beta1",
            "kind": "MSSQLServer",
            "metadata": {
                "name": variable.prefix,
            },
            "spec": {
                "providerConfigRef": variable.providerConfigRef,
                "forProvider": {
                    "location": variable.location,
                    "resourceGroupName": variable.resourceGroupName,
                    "version": "12.0",
                    "azureadAdministrator": [{
                        "loginUsername": admin_name,
                        "objectId": admin_principal,
                        "azureadAuthenticationOnly": True,
                    }],
                },
            },
        })

        # Grant each application identity a database user.
        fqdn = get(sqlserver.observed, "status.atProvider.fullyQualifiedDomainName")
        if not fqdn:
            pending("fullyQualifiedDomainName on the SQL server")
            return

        for user in variable.databaseUsers:
            # The identity's own generation is what makes this Job re-run when
            # the identity changes and stay put when it does not. The original
            # had no way to express that, so it re-ran every five minutes
            # forever instead.
            generation = get(appIdentity, "metadata.generation", 0)

            script = "\n".join([
                "CREATE USER [" + user.identity + "] FROM EXTERNAL PROVIDER;",
                "ALTER ROLE db_datareader ADD MEMBER [" + user.identity + "];",
                "ALTER ROLE db_datawriter ADD MEMBER [" + user.identity + "];",
                "GO",
            ]) + "\n"

            resource({
                "apiVersion": "batch/v1",
                "kind": "Job",
                "metadata": {
                    "name": variable.prefix + "-sqlcmd-" + user.name + "-" + str(generation),
                },
                "spec": {
                    "backoffLimit": 4,
                    "template": {
                        "spec": {
                            "serviceAccountName": variable.prefix + "-sqladmin",
                            "restartPolicy": "Never",
                            "containers": [{
                                "name": "sqlcmd",
                                "image": variable.sqlcmdImage,
                                "command": ["/bin/sh", "-c"],
                                "args": [
                                    "sqlcmd -S " + fqdn + " -d " + variable.prefix +
                                    " --authentication-method ActiveDirectoryWorkloadIdentity -i /script/grant.sql",
                                ],
                                "volumeMounts": [{"name": "script", "mountPath": "/script"}],
                            }],
                            "volumes": [{
                                "name": "script",
                                "configMap": {"name": variable.prefix + "-sqlcmd-" + user.name},
                            }],
                        },
                    },
                },
            })

            # The script lives in its own ConfigMap that the Job declares a
            # need for, so it exists before the Job mounts it and outlives it
            # on teardown. Saying which ConfigMap is the point: a number could
            # have been wrong in a way nothing would notice.
            resource({
                "apiVersion": "v1",
                "kind": "ConfigMap",
                "metadata": {
                    "name": variable.prefix + "-sqlcmd-" + user.name,
                },
                "data": {"grant.sql": script},
            })

        return
