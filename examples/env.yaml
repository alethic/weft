# Merges three of the originals: env-identity, env-roleassignments, and
# env-serviceaccount, plus the standalone roleassignments composition whose only
# distinguishing feature was reading a ConfigMap this chart does not create.
#
# Structurally the same shape as examples/app.yaml - identity first, then what
# consumes it - which is the point: once staging is expressible, most of these
# compositions turn out to be the same composition.
apiVersion: weft.run/v1alpha1
kind: Weave
metadata:
  name: env
  namespace: sweep-labs
spec:
  serviceAccountName: sweep-env-compose

  variables:
    - values:
        prefix: sweep-env
        resourceName: sweep-env
        subscriptionId: "00000000-0000-0000-0000-000000000000"
        location: eastus
        resourceGroupName: sweep-env
        providerConfigRef:
          name: azure-default
        roles:
        - name: env-managed-identity-operator
          roleDefinitionId: befefa01-2a29-4197-83a8-272ff33ce314
        - name: env-cosmos-db-operator
          roleDefinitionId: 230815da-be43-4aae-9cb4-875f7bd000aa


  program: |
    def compose(variable):
        resourceGroup = read("azure.m.upbound.io/v1beta1", "ResourceGroup", "sweep-env")
        tenant = read("v1", "ConfigMap", "tenant")

        rg_id = require(resourceGroup, "status.atProvider.id")
        tenant_id = require(tenant, "data.tenantId")
        name = variable.resourceName + "-env"

        env_identity = resource({
            "apiVersion": "managedidentity.azure.m.upbound.io/v1beta1",
            "kind": "UserAssignedIdentity",
            "metadata": {
                "name": variable.prefix + "-env",
                "annotations": {
                    "crossplane.io/external-name":
                        rg_id + "/providers/Microsoft.ManagedIdentity/userAssignedIdentities/" + name,
                },
            },
            "spec": {
                "providerConfigRef": variable.providerConfigRef,
                "forProvider": {
                    "name": name,
                    "location": variable.location,
                    "resourceGroupName": variable.resourceGroupName,
                },
            },
        })

        client_id = get(env_identity.observed, "status.atProvider.clientId")
        principal = get(env_identity.observed, "status.atProvider.principalId")
        if not client_id or not principal:
            pending("clientId and principalId on the env identity")
            return

        resource({
            "apiVersion": "v1",
            "kind": "ServiceAccount",
            "metadata": {
                "name": variable.prefix + "-env",
                "annotations": {
                    "azure.workload.identity/client-id": client_id,
                    "azure.workload.identity/tenant-id": tenant_id,
                },
            },
        })

        for role in variable.roles:
            resource({
                "apiVersion": "authorization.azure.m.upbound.io/v1beta1",
                "kind": "RoleAssignment",
                "metadata": {
                    "name": variable.prefix + "-" + role.name,
                },
                "spec": {
                    "providerConfigRef": variable.providerConfigRef,
                    "forProvider": {
                        "roleDefinitionId": "/subscriptions/" + variable.subscriptionId +
                            "/providers/Microsoft.Authorization/roleDefinitions/" + role.roleDefinitionId,
                        "scope": rg_id,
                        "principalId": principal,
                    },
                },
            })

        return
