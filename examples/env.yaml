# Merges three of the originals: env-identity, env-roleassignments, and
# env-serviceaccount, plus the standalone roleassignments composition whose only
# distinguishing feature was reading a ConfigMap this chart does not create.
#
# Structurally the same shape as examples/app.yaml - identity first, then what
# consumes it - which is the point: once staging is expressible, most of these
# compositions turn out to be the same composition.
apiVersion: weft.run/v1alpha1
kind: Weave
metadata:
  name: env
  namespace: sweep-labs
spec:
  serviceAccountName: sweep-env-compose

  inputs:
    - values:
        prefix: sweep-env
        resourceName: sweep-env
        subscriptionId: "00000000-0000-0000-0000-000000000000"
        location: eastus
        resourceGroupName: sweep-env
        providerConfigRef:
          name: azure-default
        roles:
        - name: env-managed-identity-operator
          roleDefinitionId: befefa01-2a29-4197-83a8-272ff33ce314
        - name: env-cosmos-db-operator
          roleDefinitionId: 230815da-be43-4aae-9cb4-875f7bd000aa

  sources:
  - id: resourceGroup
    apiVersion: azure.m.upbound.io/v1beta1
    kind: ResourceGroup
    name: sweep-env
    required: true

  # Not created by this chart at all. Provenance of a source is arbitrary - it
  # is somebody else's object that happens to live in this namespace - which is
  # the general case rather than an edge case, and is why every read is
  # impersonated: this Weave gets to read it only if its ServiceAccount was
  # granted access to it.
  - id: tenant
    apiVersion: v1
    kind: ConfigMap
    name: tenant
    required: true

  program: |
    def compose(inputs, sources, observed):
        out = {}

        rg_id = require(sources.resourceGroup, "status.atProvider.id")
        tenant_id = require(sources.tenant, "data.tenantId")
        name = inputs.resourceName + "-env"

        out["env-identity"] = {
            "apiVersion": "managedidentity.azure.m.upbound.io/v1beta1",
            "kind": "UserAssignedIdentity",
            "metadata": {
                "name": inputs.prefix + "-env",
                "annotations": {
                    "weft.run/wave": "0",
                    "crossplane.io/external-name":
                        rg_id + "/providers/Microsoft.ManagedIdentity/userAssignedIdentities/" + name,
                },
            },
            "spec": {
                "providerConfigRef": inputs.providerConfigRef,
                "forProvider": {
                    "name": name,
                    "location": inputs.location,
                    "resourceGroupName": inputs.resourceGroupName,
                },
            },
        }

        client_id = get(observed, ["env-identity", "status", "atProvider", "clientId"])
        principal = get(observed, ["env-identity", "status", "atProvider", "principalId"])
        if not client_id or not principal:
            pending("clientId and principalId on the env identity")
            return out

        out["env-serviceaccount"] = {
            "apiVersion": "v1",
            "kind": "ServiceAccount",
            "metadata": {
                "name": inputs.prefix + "-env",
                "annotations": {
                    "weft.run/wave": "1",
                    "azure.workload.identity/client-id": client_id,
                    "azure.workload.identity/tenant-id": tenant_id,
                },
            },
        }

        for role in inputs.roles:
            out["ra-" + role.name] = {
                "apiVersion": "authorization.azure.m.upbound.io/v1beta1",
                "kind": "RoleAssignment",
                "metadata": {
                    "name": inputs.prefix + "-" + role.name,
                    "annotations": {"weft.run/wave": "1"},
                },
                "spec": {
                    "providerConfigRef": inputs.providerConfigRef,
                    "forProvider": {
                        "roleDefinitionId": "/subscriptions/" + inputs.subscriptionId +
                            "/providers/Microsoft.Authorization/roleDefinitions/" + role.roleDefinitionId,
                        "scope": rg_id,
                        "principalId": principal,
                    },
                },
            }

        return out
