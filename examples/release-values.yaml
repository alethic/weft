# The fan-in. Eight reads, almost pure leaf substitution, producing a single
# ConfigMap whose one key holds an entire values.yaml document.
#
# This one stays on its own. Nothing else reads what it produces, so merging it
# into another Weave would only couple two things that have no reason to move
# together.
#
# It is the clearest case for to_yaml(). The original did this by hand in a Go
# template with careful nindent counts, which is exactly the kind of thing that
# breaks silently when someone adds a nesting level.
apiVersion: weft.run/v1alpha1
kind: Weave
metadata:
  name: release-values
  namespace: sweep-labs
spec:
  serviceAccountName: sweep-env-compose

  variables:
    - values:
        prefix: sweep-env
        targetConfigMap: sweep-env-values


  program: |
    def compose(variable):
        appIdentity = read("managedidentity.azure.m.upbound.io/v1beta1", "UserAssignedIdentity", "sweep-env-app")
        kedaIdentity = read("managedidentity.azure.m.upbound.io/v1beta1", "UserAssignedIdentity", "sweep-env-keda")
        vault = read("keyvault.azure.m.upbound.io/v1beta1", "Vault", "sweep-env")
        serviceBus = read("servicebus.azure.m.upbound.io/v1beta1", "ServiceBusNamespace", "sweep-env")
        sqlServer = read("sql.azure.m.upbound.io/v1beta1", "MSSQLServer", "sweep-env")
        database = read("sql.azure.m.upbound.io/v1beta1", "MSSQLDatabase", "sweep-env")
        storage = read("storage.azure.m.upbound.io/v1beta1", "Account", "sweepenv")
        cosmos = read("cosmosdb.azure.m.upbound.io/v1beta1", "Account", "sweep-env")
        # A pure ordering edge: nothing below reads a field off the database,
        # but publishing configuration that points at a database which does not
        # exist is worse than publishing nothing.
        if not database:
            return wait("the MSSQLDatabase has not been created yet")

        # Every one of these is a require: the document is only meaningful when
        # it is complete, and half a values.yaml is worse than none. A single
        # unresolved field puts the whole Weave in Waiting, naming that field.
        values = {
            "identity": {
                "clientId": require(appIdentity, "status.atProvider.clientId"),
                "principalId": require(appIdentity, "status.atProvider.principalId"),
            },
            "keda": {
                "clientId": require(kedaIdentity, "status.atProvider.clientId"),
            },
            "keyVault": {
                "uri": require(vault, "status.atProvider.vaultUri"),
            },
            "serviceBus": {
                "endpoint": require(serviceBus, "status.atProvider.endpoint"),
                # A map index with no schema, written back asynchronously by the
                # provider. Treated exactly like a missing status field: not an
                # error, just not yet.
                "namespace": require(serviceBus,
                    'metadata.annotations["crossplane.io/external-name"]'),
            },
            "sql": {
                "fqdn": require(sqlServer, "status.atProvider.fullyQualifiedDomainName"),
            },
            "storage": {
                "account": require(storage,
                    'metadata.annotations["crossplane.io/external-name"]'),
            },
            "cosmos": {
                "endpoint": require(cosmos, "status.atProvider.endpoint"),
            },
        }

        resource({
            "apiVersion": "v1",
            "kind": "ConfigMap",
            "metadata": {"name": variable.targetConfigMap},
            # One key holding a whole document. This is the single most
            # common shape in the compositions this replaces, so it is a
            # builtin rather than string assembly.
            "data": {"values.yaml": to_yaml(values)},
            })
