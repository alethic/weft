# The fan-in. Nine sources, almost pure leaf substitution, producing a single
# ConfigMap whose one key holds an entire values.yaml document.
#
# This one stays on its own. Nothing else reads what it produces, so merging it
# into another Weave would only couple two things that have no reason to move
# together.
#
# It is the clearest case for to_yaml(). The original did this by hand in a Go
# template with careful nindent counts, which is exactly the kind of thing that
# breaks silently when someone adds a nesting level.
apiVersion: weft.run/v1alpha1
kind: Weave
metadata:
  name: release-values
  namespace: sweep-labs
spec:
  serviceAccountName: sweep-env-compose

  inputs:
    prefix: sweep-env
    targetConfigMap: sweep-env-values

  sources:
  - id: appIdentity
    apiVersion: managedidentity.azure.m.upbound.io/v1beta1
    kind: UserAssignedIdentity
    name: sweep-env-app
    required: true
  - id: kedaIdentity
    apiVersion: managedidentity.azure.m.upbound.io/v1beta1
    kind: UserAssignedIdentity
    name: sweep-env-keda
    required: true
  - id: vault
    apiVersion: keyvault.azure.m.upbound.io/v1beta1
    kind: Vault
    name: sweep-env
    required: true
  - id: serviceBus
    apiVersion: servicebus.azure.m.upbound.io/v1beta1
    kind: ServiceBusNamespace
    name: sweep-env
    required: true
  - id: sqlServer
    apiVersion: sql.azure.m.upbound.io/v1beta1
    kind: MSSQLServer
    name: sweep-env
    required: true

  # Asserted present, never read. The values document does not contain a single
  # field from the database, but the application cannot start without it, so
  # publishing the configuration before it exists would hand the app a config
  # that points at nothing.
  #
  # This edge is invisible to any design that infers dependencies from
  # expression references, because there is no expression to infer it from.
  # required exists for exactly this.
  - id: database
    apiVersion: sql.azure.m.upbound.io/v1beta1
    kind: MSSQLDatabase
    name: sweep-env
    required: true

  - id: storage
    apiVersion: storage.azure.m.upbound.io/v1beta1
    kind: Account
    name: sweepenv
    required: true
  - id: cosmos
    apiVersion: cosmosdb.azure.m.upbound.io/v1beta1
    kind: Account
    name: sweep-env
    required: true

  program: |
    def compose(inputs, sources, observed):
        # Every one of these is a require: the document is only meaningful when
        # it is complete, and half a values.yaml is worse than none. A single
        # unresolved field puts the whole Weave in Waiting, naming that field.
        values = {
            "identity": {
                "clientId": require(sources.appIdentity, "status.atProvider.clientId"),
                "principalId": require(sources.appIdentity, "status.atProvider.principalId"),
            },
            "keda": {
                "clientId": require(sources.kedaIdentity, "status.atProvider.clientId"),
            },
            "keyVault": {
                "uri": require(sources.vault, "status.atProvider.vaultUri"),
            },
            "serviceBus": {
                "endpoint": require(sources.serviceBus, "status.atProvider.endpoint"),
                # A map index with no schema, written back asynchronously by the
                # provider. Treated exactly like a missing status field: not an
                # error, just not yet.
                "namespace": require(sources.serviceBus,
                    'metadata.annotations["crossplane.io/external-name"]'),
            },
            "sql": {
                "fqdn": require(sources.sqlServer, "status.atProvider.fullyQualifiedDomainName"),
            },
            "storage": {
                "account": require(sources.storage,
                    'metadata.annotations["crossplane.io/external-name"]'),
            },
            "cosmos": {
                "endpoint": require(sources.cosmos, "status.atProvider.endpoint"),
            },
        }

        return {
            "values": {
                "apiVersion": "v1",
                "kind": "ConfigMap",
                "metadata": {"name": inputs.targetConfigMap},
                # One key holding a whole document. This is the single most
                # common shape in the compositions this replaces, so it is a
                # builtin rather than string assembly.
                "data": {"values.yaml": to_yaml(values)},
            },
        }
