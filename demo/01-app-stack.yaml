# The whole model in one object.
#
# Three phases, a fan-out, a generated document, a derived Secret, and a
# Deployment that only appears once the things it mounts exist. Every phase
# boundary is a field that the API server writes after the apply, which is the
# same shape as a cloud provider writing back status minutes later - just fast
# enough to watch.
#
#   kubectl -n weft-demo get weave app-stack -w
#
apiVersion: weft.run/v1alpha1
kind: Weave
metadata:
  name: app-stack
  namespace: weft-demo
spec:
  serviceAccountName: composer

  variables:
    - values:
        name: shop
        image: registry.k8s.io/pause:3.9
        replicas: 2

        # Fan-out. In a Helm chart this was a range at build time producing N copies
        # of everything; here it is data, and the program loops over it.
        environments:
          - name: dev
            replicas: 1
            debug: true
          - name: staging
            replicas: 2
            debug: true
          - name: prod
            replicas: 5
            debug: false

        features:
          - name: search
            enabled: true
          - name: recommendations
            enabled: false
          - name: checkout
            enabled: true


  program: |
    def compose(variable):
        platform = read("v1", "ConfigMap", "platform")

        # Nothing can be built without these, so require() rather than get():
        # a missing one puts the Weave in Waiting naming the exact field.
        tenant = require(platform, "data.tenantId")
        region = get(platform, "data.region", "unknown")

        # An annotation key, which is not an identifier and so cannot be
        # reached with attribute syntax. Written by whoever owns the platform
        # ConfigMap, so it may not be there yet.
        cluster = get(platform, 'metadata.annotations["platform.example/cluster"]', "unregistered")

        # ---- the identity everything else hangs off -------------------------
        sa = resource({
            "apiVersion": "v1",
            "kind": "ServiceAccount",
            "metadata": {"name": variable.name},
        })

        # The API server assigns the uid after the apply returns. Until it
        # lands, everything downstream is simply not returned - which is
        # exactly how a provider writing status.atProvider behaves, only
        # faster.
        sa_uid = get(sa.observed, "metadata.uid")
        if not sa_uid:
            pending("the ServiceAccount has not been assigned a uid")
            return

        # ---- everything derived from that identity --------------------------
        #
        # Each says what it needs rather than which step it belongs to, and the
        # depth falls out: these all need the ServiceAccount and nothing needs
        # them, so they land together and are torn down in one go.

        # Serialising a structure into a string field is the single most common
        # thing these compositions do, so it is a builtin. Mapping order is the
        # order written here, because a person reads this.
        settings = {
            "tenant": tenant,
            "region": region,
            "cluster": cluster,
            "identity": {
                "serviceAccountName": variable.name,
                "uid": sa_uid,
            },
            "features": [f.name for f in variable.features if f.enabled],
            "environments": {
                e.name: {"replicas": e.replicas, "debug": e.debug}
                for e in variable.environments
            },
        }

        values = resource({
            "apiVersion": "v1",
            "kind": "ConfigMap",
            "metadata": {
                "name": variable.name + "-values",
            },
            "data": {
                "values.yaml": to_yaml(settings),
                "features.json": to_json([f.name for f in variable.features if f.enabled]),
            },
        }, needs=sa)

        # A Secret whose contents are derived rather than stored anywhere. The
        # uid is stable for the life of the ServiceAccount, so the token is too
        # - and it changes if the identity is ever recreated.
        token = sha256(tenant + ":" + sa_uid)
        secret = resource({
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {
                "name": variable.name + "-derived",
            },
            "type": "Opaque",
            "data": {
                "token": b64encode(token),
                "tenant": b64encode(tenant),
            },
        }, needs=sa)

        # The fan-out. Each names the ServiceAccount and none of them names
        # another, so they all come out at one depth and teardown removes them
        # in a single step rather than one round trip at a time.
        for env in variable.environments:
            resource({
                "apiVersion": "v1",
                "kind": "ConfigMap",
                "metadata": {
                    "name": variable.name + "-" + env.name,
                    "labels": {"environment": env.name},
                },
                "data": {
                    "replicas": str(env.replicas),
                    "debug": str(env.debug).lower(),
                    "endpoint": "https://" + env.name + "." + region + ".example.test",
                },
            }, needs=sa)

        # ---- the workload, once what it mounts exists -----------------------
        secret_uid = get(secret.observed, "metadata.uid")
        if not secret_uid:
            pending("the derived Secret has not been created")
            return

        resource({
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "metadata": {
                "name": variable.name,
            },
            "spec": {
                "replicas": variable.replicas,
                "selector": {"matchLabels": {"app": variable.name}},
                "template": {
                    "metadata": {"labels": {"app": variable.name}},
                    "spec": {
                        "serviceAccountName": variable.name,
                        "containers": [{
                            "name": "app",
                            "image": variable.image,
                            "env": [{
                                "name": "TENANT",
                                "valueFrom": {
                                    "secretKeyRef": {
                                        "name": variable.name + "-derived",
                                        "key": "tenant",
                                    },
                                },
                            }],
                            "volumeMounts": [{
                                "name": "values",
                                "mountPath": "/etc/app",
                                "readOnly": True,
                            }],
                        }],
                        "volumes": [{
                            "name": "values",
                            "configMap": {"name": variable.name + "-values"},
                        }],
                    },
                },
            },
        }, needs=[values, secret])

        resource({
            "apiVersion": "v1",
            "kind": "Service",
            "metadata": {
                "name": variable.name,
            },
            "spec": {
                "selector": {"app": variable.name},
                "ports": [{"port": 80, "targetPort": 80, "name": "http"}],
            },
        }, needs=[values, secret])

        return
