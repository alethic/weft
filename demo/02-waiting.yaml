# The third outcome.
#
# Resolution succeeds, fails permanently, or is simply not yet - and "not yet"
# is the state a composition spends most of its life in, so it has a condition
# of its own rather than being an error.
#
# This one waits on a source that does not exist. Create it and watch the Weave
# resolve itself with nothing else touched:
#
#   kubectl -n weft-demo create configmap tenant --from-literal=tenantId=acme-42
#
apiVersion: weft.run/v1alpha1
kind: Weave
metadata:
  name: waiting
  namespace: weft-demo
spec:
  serviceAccountName: composer

  program: |
    def compose(variable, observed):
        tenant = read("v1", "ConfigMap", "tenant")
        licence = read("v1", "ConfigMap", "licence")
        # The ordering gate. Nothing below reads a field off it; its existence
        # is the whole requirement.
        if not licence:
            return wait("no licence ConfigMap in this namespace yet")

        return {
            "greeting": {
                "apiVersion": "v1",
                "kind": "ConfigMap",
                "metadata": {"name": "greeting"},
                "data": {
                    "tenant": require(tenant, "data.tenantId"),
                    # A field that will never appear on a ConfigMap, reached
                    # with get() and a default rather than require(), so its
                    # absence is a value rather than a wait.
                    "provisioned": get(tenant, "status.atProvider.id", "not-a-managed-resource"),
                },
            },
        }
