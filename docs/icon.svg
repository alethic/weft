<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Weft">
  <title>Weft</title>
  <rect width="128" height="128" rx="24" fill="#1f2933"/>
  <!-- The warp: threads held on the loom, read but not owned. -->
  <g stroke="#7b8794" stroke-width="7" stroke-linecap="round">
    <line x1="36" y1="26" x2="36" y2="102"/>
    <line x1="64" y1="26" x2="64" y2="102"/>
    <line x1="92" y1="26" x2="92" y2="102"/>
  </g>
  <!-- The weft: what we pass across them, and create. -->
  <g stroke="#38bec9" stroke-width="9" stroke-linecap="round">
    <line x1="26" y1="46" x2="102" y2="46"/>
    <line x1="26" y1="82" x2="102" y2="82"/>
  </g>
</svg>
