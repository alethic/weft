apiVersion: apps/v1
kind: Deployment
metadata:
  name: weft-controller
  namespace: weft-system
  labels:
    app.kubernetes.io/name: weft
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: weft
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weft
    spec:
      serviceAccountName: weft-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: ghcr.io/alethic/weft:latest
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - name: metrics
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
      terminationGracePeriodSeconds: 30
